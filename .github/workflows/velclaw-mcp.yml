name: VelClaw MCP App

on:
  push:
    paths:
      - 'mcp/velclaw/**'
      - '.github/workflows/velclaw-mcp.yml'
  pull_request:
    paths:
      - 'mcp/velclaw/**'
      - '.github/workflows/velclaw-mcp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/velclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/velclaw/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build MCP server and widget
        run: npm run build
